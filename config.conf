# StorageSentinel shell configuration
# Edit these values to customize scanning and cleanup behavior.

SCAN_ROOT="/home"
ALERT_WARNING_PCT=80
ALERT_CRITICAL_PCT=90
ALERT_EMERGENCY_PCT=95
LARGE_FILE_GB=5
MIN_DIR_SIZE_GB=1
TRASH_MAX_AGE_DAYS=30
CLEAN_CONDA_CACHE=1
CLEAN_PIP_CACHE=1
CLEAN_JOURNALD_LOGS=1
JOURNALD_MAX_AGE_DAYS=30
DUPLICATE_MIN_SIZE_MB=50

# Directories under SCAN_ROOT untouched longer than this are flagged as cold data.
COLD_DATA_DAYS=180

# Flat per-user storage quota (GB) applied to every user discovered under SCAN_ROOT.
DEFAULT_QUOTA_GB=150.0

# Protected paths are never deleted or modified.
PROTECTED_PATHS=("/var/lib/postgresql" "/var/lib/mysql" "/etc" "/boot")
PROTECTED_EXTENSIONS=(".db" ".sqlite" ".sqlite3")

# Optional email alerting using mail(1). Set ENABLE_EMAIL=1 to use.
ENABLE_EMAIL=0
MAIL_CMD="mail"
SMTP_SERVER="localhost"
SMTP_PORT=25
FROM_ADDRESS="sentinel@yourdomain.com"
TO_ADDRESSES=("admin@yourdomain.com")

# Server health database and root path used by shell monitoring.
SERVER_HEALTH_DB="server_health.db"
SERVER_HEALTH_ROOT="/"